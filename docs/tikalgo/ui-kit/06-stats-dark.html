<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stats · TIKALGO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/tikalgo.js"></script>
</head>
<body class="min-h-screen bg-white font-sans text-neutral-900 antialiased">
  <section class="mx-auto max-w-5xl px-4 py-20">
    <div class="rounded-3xl bg-ink p-8 text-white sm:p-12">
      <p class="text-xs font-semibold uppercase tracking-widest text-brand">Last 30 days</p>
      <h2 class="mt-2 max-w-xl text-2xl font-semibold tracking-tight sm:text-3xl">TIKALGO AI says WAIT more often than it trades — and that is the point.</h2>
      <div class="mt-10 grid gap-8 sm:grid-cols-3">
        <div>
          <p class="bg-gradient-to-r from-brand to-white bg-clip-text font-mono text-5xl font-semibold tracking-tight text-transparent">12.4k</p>
          <p class="mt-2 text-sm text-white/60">Signals evaluated</p>
          <span class="mt-3 inline-flex items-center gap-1 rounded-full bg-brand/15 px-2 py-0.5 text-xs font-medium text-brand">▲ 8.2%</span>
        </div>
        <div>
          <p class="font-mono text-5xl font-semibold tracking-tight">71%</p>
          <p class="mt-2 text-sm text-white/60">Candidates filtered as NO TRADE</p>
          <span class="mt-3 inline-flex items-center gap-1 rounded-full bg-brand/15 px-2 py-0.5 text-xs font-medium text-brand">▲ 3.1 pts</span>
        </div>
        <div>
          <p class="bg-gradient-to-r from-ai to-white bg-clip-text font-mono text-5xl font-semibold tracking-tight text-transparent">0.9s</p>
          <p class="mt-2 text-sm text-white/60">Median decision latency</p>
          <span class="mt-3 inline-flex items-center gap-1 rounded-full bg-down/15 px-2 py-0.5 text-xs font-medium text-down">▼ 0.2s</span>
        </div>
      </div>
      <p class="mt-10 text-xs text-white/40">Demo figures. In production, bind each value to the analytics API.</p>
    </div>
  </section>
</body>
</html>
