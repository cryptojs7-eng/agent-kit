<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check your inbox · TIKALGO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/tikalgo.js"></script>
</head>
<body class="min-h-screen bg-neutral-50 font-sans text-neutral-900 antialiased">
  <main class="grid min-h-screen place-items-center px-4 py-16">
    <div class="w-full max-w-sm rounded-2xl border border-neutral-200 bg-white p-8 text-center shadow-sm">
      <div class="mx-auto grid size-14 place-items-center rounded-full bg-neutral-100 text-ink">
        <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>
      </div>
      <h1 class="mt-6 text-xl font-semibold">Check your inbox</h1>
      <p class="mt-2 text-sm text-neutral-500">
        We sent a verification link to
        <span class="font-medium text-neutral-900">javad@example.com</span>
        <a href="#" class="ms-1 text-xs font-medium text-brand-dark underline underline-offset-2">change</a>
      </p>

      <ul class="mt-6 space-y-2 text-start text-sm text-neutral-500">
        <li class="flex items-start gap-2"><svg class="mt-0.5 size-4 shrink-0 text-brand-dark" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M16.7 5.3a1 1 0 0 1 0 1.4l-7.5 7.5a1 1 0 0 1-1.4 0L3.3 9.7a1 1 0 1 1 1.4-1.4l3.8 3.8 6.8-6.8a1 1 0 0 1 1.4 0Z" clip-rule="evenodd"/></svg>The link works once.</li>
        <li class="flex items-start gap-2"><svg class="mt-0.5 size-4 shrink-0 text-brand-dark" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M16.7 5.3a1 1 0 0 1 0 1.4l-7.5 7.5a1 1 0 0 1-1.4 0L3.3 9.7a1 1 0 1 1 1.4-1.4l3.8 3.8 6.8-6.8a1 1 0 0 1 1.4 0Z" clip-rule="evenodd"/></svg>It expires in one hour.</li>
        <li class="flex items-start gap-2"><svg class="mt-0.5 size-4 shrink-0 text-brand-dark" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M16.7 5.3a1 1 0 0 1 0 1.4l-7.5 7.5a1 1 0 0 1-1.4 0L3.3 9.7a1 1 0 1 1 1.4-1.4l3.8 3.8 6.8-6.8a1 1 0 0 1 1.4 0Z" clip-rule="evenodd"/></svg>You can close this tab once you're verified.</li>
      </ul>

      <button id="resend" type="button" disabled
        class="mt-8 w-full rounded-xl border border-neutral-300 px-4 py-2.5 text-sm font-medium transition hover:bg-neutral-50 focus:outline-none focus-visible:ring-4 focus-visible:ring-brand/30 disabled:cursor-not-allowed disabled:text-neutral-400 disabled:hover:bg-transparent">
        Resend email
      </button>
      <p id="sent" class="mt-3 text-xs text-neutral-400" aria-live="polite">Sent 1 time</p>

      <p class="mt-8 border-t border-neutral-100 pt-6 text-xs text-neutral-500">
        Still nothing? <a href="#" class="font-medium text-neutral-900 underline underline-offset-2">Contact support</a>
      </p>
    </div>
  </main>

  <script>
    const btn = document.getElementById('resend');
    const sentLine = document.getElementById('sent');
    let sends = 1;
    let timer;

    function countdown(seconds) {
      clearInterval(timer);
      let left = seconds;
      btn.disabled = true;
      const render = () => (btn.textContent = `Resend email in ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`);
      render();
      timer = setInterval(() => {
        left -= 1;
        if (left <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = 'Resend email'; return; }
        render();
      }, 1000);
    }

    btn.addEventListener('click', () => {
      // Production: call the existing resend endpoint (server enforces the same back-off).
      sends += 1;
      sentLine.textContent = `Sent ${sends} times`;
      countdown(30 * 2 ** (sends - 1)); // 30s, 60s, 120s, …
    });

    countdown(30);
  </script>
</body>
</html>
