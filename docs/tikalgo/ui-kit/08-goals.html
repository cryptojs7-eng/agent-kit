<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goals · TIKALGO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/tikalgo.js"></script>
</head>
<body class="min-h-screen bg-neutral-50 font-sans text-neutral-900 antialiased">
  <section class="mx-auto max-w-xl px-4 py-20">
    <article class="rounded-2xl border border-neutral-200 bg-white p-6">
      <header class="flex items-baseline justify-between">
        <h2 class="text-lg font-semibold">Q4 2026 trading goals</h2>
        <p class="text-xs text-neutral-400">Updated today</p>
      </header>
      <ul class="mt-6 space-y-6">
        <li>
          <div class="flex justify-between text-sm"><span class="font-medium">Net expectancy</span><span class="font-mono text-neutral-500">0.34R / 0.30R</span></div>
          <div class="mt-2 h-1.5 rounded-full bg-neutral-100"><div class="h-full rounded-full bg-ink" style="width:100%"></div></div>
          <p class="mt-1 text-xs text-brand-dark">On track</p>
        </li>
        <li>
          <div class="flex justify-between text-sm"><span class="font-medium">Max drawdown under 8%</span><span class="font-mono text-neutral-500">4.8% / 8%</span></div>
          <div class="mt-2 h-1.5 rounded-full bg-neutral-100"><div class="h-full rounded-full bg-ink" style="width:60%"></div></div>
          <p class="mt-1 text-xs text-brand-dark">On track</p>
        </li>
        <li>
          <div class="flex justify-between text-sm"><span class="font-medium">Journal reviewed trades</span><span class="font-mono text-neutral-500">31 / 60</span></div>
          <div class="mt-2 h-1.5 rounded-full bg-neutral-100"><div class="h-full rounded-full bg-amber-500" style="width:52%"></div></div>
          <p class="mt-1 text-xs text-amber-600">Behind</p>
        </li>
        <li>
          <div class="flex justify-between text-sm"><span class="font-medium">Paper days before LIVE review</span><span class="font-mono text-neutral-500">24 / 30</span></div>
          <div class="mt-2 h-1.5 rounded-full bg-neutral-100"><div class="h-full rounded-full bg-ink" style="width:80%"></div></div>
          <p class="mt-1 text-xs text-brand-dark">On track</p>
        </li>
      </ul>
    </article>
  </section>
</body>
</html>
