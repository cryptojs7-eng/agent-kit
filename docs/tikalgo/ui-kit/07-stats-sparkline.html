<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Performance cards · TIKALGO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/tikalgo.js"></script>
</head>
<body class="min-h-screen bg-neutral-50 font-sans text-neutral-900 antialiased">
  <section class="mx-auto max-w-5xl px-4 py-20">
    <h2 class="text-lg font-semibold">Paper portfolio</h2>
    <div class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      <article class="rounded-2xl border border-neutral-200 bg-white p-5">
        <p class="text-sm text-neutral-500">Net PnL (R)</p>
        <div class="mt-2 flex items-center gap-2"><p class="font-mono text-3xl font-semibold">+14.6R</p><span class="rounded-full bg-brand-soft px-2 py-0.5 text-xs font-medium text-brand-dark">+2.1R</span></div>
        <div class="mt-5 flex h-10 items-end gap-1.5" aria-hidden="true">
          <span class="h-3 flex-1 rounded-full bg-neutral-200"></span><span class="h-5 flex-1 rounded-full bg-neutral-200"></span><span class="h-4 flex-1 rounded-full bg-neutral-200"></span><span class="h-7 flex-1 rounded-full bg-neutral-200"></span>
          <span class="h-6 flex-1 rounded-full bg-neutral-200"></span><span class="h-8 flex-1 rounded-full bg-neutral-200"></span><span class="h-7 flex-1 rounded-full bg-neutral-200"></span><span class="h-10 flex-1 rounded-full bg-ink"></span>
        </div>
      </article>
      <article class="rounded-2xl border border-neutral-200 bg-white p-5">
        <p class="text-sm text-neutral-500">Expectancy per trade</p>
        <div class="mt-2 flex items-center gap-2"><p class="font-mono text-3xl font-semibold">0.34R</p><span class="rounded-full bg-brand-soft px-2 py-0.5 text-xs font-medium text-brand-dark">+0.05</span></div>
        <div class="mt-5 flex h-10 items-end gap-1.5" aria-hidden="true">
          <span class="h-5 flex-1 rounded-full bg-neutral-200"></span><span class="h-4 flex-1 rounded-full bg-neutral-200"></span><span class="h-6 flex-1 rounded-full bg-neutral-200"></span><span class="h-5 flex-1 rounded-full bg-neutral-200"></span>
          <span class="h-7 flex-1 rounded-full bg-neutral-200"></span><span class="h-6 flex-1 rounded-full bg-neutral-200"></span><span class="h-8 flex-1 rounded-full bg-neutral-200"></span><span class="h-9 flex-1 rounded-full bg-ink"></span>
        </div>
      </article>
      <article class="rounded-2xl border border-neutral-200 bg-white p-5">
        <p class="text-sm text-neutral-500">Max drawdown</p>
        <div class="mt-2 flex items-center gap-2"><p class="font-mono text-3xl font-semibold">4.8%</p><span class="rounded-full bg-down-soft px-2 py-0.5 text-xs font-medium text-down">+0.6 pts</span></div>
        <div class="mt-5 flex h-10 items-end gap-1.5" aria-hidden="true">
          <span class="h-2 flex-1 rounded-full bg-neutral-200"></span><span class="h-3 flex-1 rounded-full bg-neutral-200"></span><span class="h-5 flex-1 rounded-full bg-neutral-200"></span><span class="h-4 flex-1 rounded-full bg-neutral-200"></span>
          <span class="h-3 flex-1 rounded-full bg-neutral-200"></span><span class="h-6 flex-1 rounded-full bg-neutral-200"></span><span class="h-5 flex-1 rounded-full bg-neutral-200"></span><span class="h-7 flex-1 rounded-full bg-ink"></span>
        </div>
      </article>
    </div>
    <p class="mt-4 text-xs text-neutral-400">Bars: last 8 weeks; the dark bar is the current week. Demo values.</p>
  </section>
</body>
</html>
