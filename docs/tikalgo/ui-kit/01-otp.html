<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTP verification · TIKALGO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/tikalgo.js"></script>
</head>
<body class="min-h-screen bg-neutral-50 font-sans text-neutral-900 antialiased">
  <main class="grid min-h-screen place-items-center px-4 py-16">
    <div class="w-full max-w-md rounded-2xl border border-neutral-200 bg-white p-8 shadow-sm">
      <img src="assets/tikalgo-logo.svg" alt="tikalgo" class="mx-auto h-8">
      <h1 class="mt-8 text-center text-xl font-semibold">Enter verification code</h1>
      <p class="mt-2 text-center text-sm text-neutral-500">
        We sent a 6-digit code to <span class="font-medium text-neutral-900">javad@example.com</span>.
        It expires in 10 minutes.
      </p>

      <form id="otp-form" class="mt-8" novalidate>
        <fieldset>
          <legend class="sr-only">Verification code</legend>
          <div id="otp" class="flex justify-center gap-2 sm:gap-3" dir="ltr">
            <input class="otp size-12 rounded-xl border border-neutral-300 text-center font-mono text-2xl font-semibold outline-none transition focus:border-ink focus:ring-4 focus:ring-brand/30" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit 1">
            <input class="otp size-12 rounded-xl border border-neutral-300 text-center font-mono text-2xl font-semibold outline-none transition focus:border-ink focus:ring-4 focus:ring-brand/30" inputmode="numeric" maxlength="1" aria-label="Digit 2">
            <input class="otp size-12 rounded-xl border border-neutral-300 text-center font-mono text-2xl font-semibold outline-none transition focus:border-ink focus:ring-4 focus:ring-brand/30" inputmode="numeric" maxlength="1" aria-label="Digit 3">
            <input class="otp size-12 rounded-xl border border-neutral-300 text-center font-mono text-2xl font-semibold outline-none transition focus:border-ink focus:ring-4 focus:ring-brand/30" inputmode="numeric" maxlength="1" aria-label="Digit 4">
            <input class="otp size-12 rounded-xl border border-neutral-300 text-center font-mono text-2xl font-semibold outline-none transition focus:border-ink focus:ring-4 focus:ring-brand/30" inputmode="numeric" maxlength="1" aria-label="Digit 5">
            <input class="otp size-12 rounded-xl border border-neutral-300 text-center font-mono text-2xl font-semibold outline-none transition focus:border-ink focus:ring-4 focus:ring-brand/30" inputmode="numeric" maxlength="1" aria-label="Digit 6">
          </div>
        </fieldset>

        <button id="verify" type="submit" disabled
          class="mt-8 w-full rounded-xl bg-ink px-4 py-3 text-sm font-semibold text-white transition hover:bg-ink-700 focus:outline-none focus-visible:ring-4 focus-visible:ring-brand/40 disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-400">
          Verify
        </button>
      </form>

      <p id="resend-line" class="mt-6 text-center text-sm text-neutral-500" aria-live="polite">
        Didn't get it? <span id="resend-slot">Resend in <span id="countdown" class="font-mono tabular-nums">0:30</span></span>
      </p>
    </div>
  </main>

  <script>
    const boxes = [...document.querySelectorAll('.otp')];
    const verify = document.getElementById('verify');
    const digitsOnly = (s) => s.replace(/\D/g, '');

    function sync() {
      verify.disabled = !boxes.every((b) => /^\d$/.test(b.value));
    }
    function fill(from, digits) {
      digits.split('').forEach((d, i) => { if (boxes[from + i]) boxes[from + i].value = d; });
      const next = Math.min(from + digits.length, boxes.length - 1);
      boxes[next].focus();
      sync();
    }

    boxes.forEach((box, i) => {
      box.addEventListener('input', () => {
        const d = digitsOnly(box.value);
        if (d.length > 1) { box.value = ''; fill(i, d.slice(0, boxes.length - i)); return; }
        box.value = d;
        if (d && i < boxes.length - 1) boxes[i + 1].focus();
        sync();
      });
      box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !box.value && i > 0) { e.preventDefault(); boxes[i - 1].value = ''; boxes[i - 1].focus(); sync(); }
        // Arrow keys follow the visual order of the field (always LTR for codes).
        if (e.key === 'ArrowLeft' && i > 0) { e.preventDefault(); boxes[i - 1].focus(); }
        if (e.key === 'ArrowRight' && i < boxes.length - 1) { e.preventDefault(); boxes[i + 1].focus(); }
      });
      box.addEventListener('focus', () => box.select());
      box.addEventListener('paste', (e) => {
        e.preventDefault();
        const d = digitsOnly((e.clipboardData || window.clipboardData).getData('text'));
        if (!d) return;
        if (d.length >= boxes.length) { boxes.forEach((b) => (b.value = '')); fill(0, d.slice(0, boxes.length)); }
        else fill(i, d.slice(0, boxes.length - i));
      });
    });
    boxes[0].focus();

    document.getElementById('otp-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (verify.disabled) return;
      const code = boxes.map((b) => b.value).join('');
      // Production: POST the code to the existing auth API; the server verifies and rate-limits.
      verify.textContent = 'Verifying…';
      console.log('submit code', code);
    });

    // Resend countdown 0:30 → live "Resend code" button.
    const slot = document.getElementById('resend-slot');
    function startCountdown(seconds) {
      slot.innerHTML = 'Resend in <span id="countdown" class="font-mono tabular-nums"></span>';
      const out = document.getElementById('countdown');
      let left = seconds;
      const render = () => (out.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`);
      render();
      const t = setInterval(() => {
        left -= 1; render();
        if (left <= 0) {
          clearInterval(t);
          slot.innerHTML = '<button type="button" id="resend" class="font-medium text-ink underline decoration-brand decoration-2 underline-offset-4 hover:text-brand-dark">Resend code</button>';
          document.getElementById('resend').addEventListener('click', () => startCountdown(30));
        }
      }, 1000);
    }
    startCountdown(30);
  </script>
</body>
</html>
