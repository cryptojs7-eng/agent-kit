<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team · TIKALGO admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/tikalgo.js"></script>
</head>
<body class="min-h-screen bg-neutral-50 font-sans text-neutral-900 antialiased">
  <main class="mx-auto max-w-6xl px-4 py-16">
    <header class="flex flex-wrap items-end justify-between gap-4">
      <div><h1 class="text-2xl font-semibold">Team</h1><p class="mt-1 text-sm text-neutral-500"><span class="font-mono">6</span> of <span class="font-mono">10</span> licensed seats in use</p></div>
      <div class="flex items-center gap-2">
        <input type="search" placeholder="Search members" class="w-56 rounded-lg border border-neutral-300 bg-white px-3 py-1.5 text-sm outline-none focus:border-ink focus:ring-4 focus:ring-brand/30">
        <button class="rounded-lg bg-ink px-3.5 py-1.5 text-sm font-semibold text-white hover:bg-ink-700">Invite people</button>
      </div>
    </header>

    <div id="bulk" class="mt-6 hidden items-center justify-between rounded-xl border border-neutral-200 bg-white px-4 py-2 text-sm">
      <span><span id="bulk-count" class="font-mono font-medium">0</span> selected</span>
      <span class="flex gap-2"><button class="rounded-lg px-3 py-1 hover:bg-neutral-100">Change role</button><button class="rounded-lg px-3 py-1 text-down hover:bg-down-soft">Suspend</button></span>
    </div>
    <p id="owner-warn" class="mt-3 hidden rounded-lg bg-amber-50 px-3 py-2 text-sm text-amber-700" role="alert">This team must keep at least one Owner. Assign another Owner first.</p>

    <div class="mt-4 overflow-x-auto rounded-xl border border-neutral-200 bg-white">
      <table class="w-full text-sm">
        <thead class="border-b border-neutral-200 text-start text-xs uppercase tracking-wider text-neutral-500">
          <tr><th class="w-10 p-3"><input id="all" type="checkbox" class="size-4 accent-ink" aria-label="Select all"></th>
            <th class="p-3 text-start font-medium">Member</th><th class="p-3 text-start font-medium">Role</th><th class="p-3 text-start font-medium">Last active</th><th class="p-3 text-start font-medium">Status</th><th class="w-10 p-3"></th></tr>
        </thead>
        <tbody id="body" class="divide-y divide-neutral-100"></tbody>
      </table>
    </div>
  </main>
  <script>
    const members = [
      ['Javad Salahi', 'javad@tikalgo.ai', 'Owner', '2 min ago', 'Active'], ['Sara Mohseni', 'sara@tikalgo.ai', 'Admin', '1 h ago', 'Active'],
      ['Reza Karimi', 'reza@tikalgo.ai', 'Editor', 'Yesterday', 'Active'], ['Lena Vogel', 'lena@partner.io', 'Viewer', '3 days ago', 'Active'],
      ['Omid Tavakoli', 'omid@tikalgo.ai', 'Editor', '—', 'Invited'], ['Noah Brown', 'noah@partner.io', 'Viewer', '2 weeks ago', 'Suspended'],
    ];
    const pill = { Active: 'bg-brand-soft text-brand-dark', Invited: 'bg-ai-soft text-ai', Suspended: 'bg-neutral-100 text-neutral-500' };
    const roles = ['Owner', 'Admin', 'Editor', 'Viewer'];
    document.getElementById('body').innerHTML = members.map(([n, e, r, last, s], i) => `
      <tr class="hover:bg-neutral-50">
        <td class="p-3"><input type="checkbox" class="row size-4 accent-ink" aria-label="Select ${n}"></td>
        <td class="p-3"><div class="flex items-center gap-3"><span class="grid size-8 place-items-center rounded-full bg-ink text-xs font-semibold text-white">${n.split(' ').map((p) => p[0]).join('')}</span><span><span class="block font-medium">${n}</span><span class="block text-xs text-neutral-500">${e}</span></span></div></td>
        <td class="p-3"><select class="role rounded-md border border-neutral-300 bg-white px-2 py-1 text-sm" data-prev="${r}">${roles.map((x) => `<option ${x === r ? 'selected' : ''}>${x}</option>`).join('')}</select></td>
        <td class="p-3 text-neutral-500">${last}</td>
        <td class="p-3"><span class="rounded-full px-2 py-0.5 text-xs font-medium ${pill[s]}">${s}</span></td>
        <td class="p-3"><button class="rounded-md px-2 py-1 text-neutral-500 hover:bg-neutral-100" aria-label="More actions for ${n}">⋯</button></td>
      </tr>`).join('');

    const all = document.getElementById('all');
    const rows = [...document.querySelectorAll('.row')];
    const bulk = document.getElementById('bulk');
    function syncBulk() {
      const n = rows.filter((r) => r.checked).length;
      document.getElementById('bulk-count').textContent = n;
      bulk.classList.toggle('hidden', n === 0); bulk.classList.toggle('flex', n > 0);
      all.checked = n === rows.length; all.indeterminate = n > 0 && n < rows.length;
    }
    all.addEventListener('change', () => { rows.forEach((r) => (r.checked = all.checked)); syncBulk(); });
    rows.forEach((r) => r.addEventListener('change', syncBulk));

    const warn = document.getElementById('owner-warn');
    document.querySelectorAll('.role').forEach((sel) => sel.addEventListener('change', () => {
      const owners = [...document.querySelectorAll('.role')].filter((s) => s.value === 'Owner').length;
      if (sel.dataset.prev === 'Owner' && owners === 0) {
        warn.classList.remove('hidden');
        sel.value = 'Owner'; // revert: the last Owner cannot be removed
        return;
      }
      warn.classList.add('hidden');
      sel.dataset.prev = sel.value; // production: PATCH the member's role via the existing admin API
    }));
  </script>
</body>
</html>
